[project]
name = "predictive-autoscaler"
version = "0.1.0"
description = "Predictive autoscaling for queue-backed workers, benchmarked against tuned reactive baselines"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    "pandas>=2.2",
    "pyarrow>=16.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "lightgbm>=4.3",
    "matplotlib>=3.8",
    "requests>=2.31",
    "holidays>=0.50",
    "scikit-learn>=1.9.0",
    "boto3>=1.43.69",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.uv]
# Keep resolution reproducible across machines.
package = true
